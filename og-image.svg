<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.8" />
      <stop offset="20%" style="stop-color:#fb923c;stop-opacity:0.4" />
      <stop offset="40%" style="stop-color:#fbbf24;stop-opacity:0.2" />
      <stop offset="60%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="80%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  
  <!-- Overlay -->
  <rect width="1200" height="630" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Main Content -->
  <g filter="url(#shadow)">
    <!-- Company Name -->
    <text x="600" y="250" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
      Organization Technology, L.L.C.
    </text>
    
    <!-- Tagline -->
    <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="600" text-anchor="middle" fill="#1a1a1a">
      Technology Innovation & Blockchain Solutions
    </text>
    
    <!-- Description -->
    <text x="600" y="380" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#1a1a1a" opacity="0.9">
      Leading provider of blockchain technology solutions,
    </text>
    <text x="600" y="410" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#1a1a1a" opacity="0.9">
      smart contract development, and comprehensive IT services
    </text>
  </g>
  
  <!-- Tech Icons -->
  <text x="1100" y="580" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#1a1a1a" opacity="0.6">🔗 ⚡ 🚀</text>
</svg>
